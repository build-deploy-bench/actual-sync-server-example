# Fly.io config for the build-deploy benchmark. Create the app with `fly apps create <name>`, then deploy with
# `fly deploy --config fly.toml --app <name> --build-arg BENCH_COMMIT=<sha>`. The app name is passed by the
# harness, not stored here. Fly builds the root Dockerfile, the same file as the other providers.
primary_region = "iad"

[http_service]
  # The upstream default port. The app reads PORT, which Fly does not set.
  internal_port = 5006
  force_https = true
  # One always-on Machine: a stopped Machine is updated but not started by `fly deploy`,
  # which would hide the boot from the deploy measurement.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Same path as the Render and Railway health checks. flyctl waits for this check before it reports the deploy
  # done, so the interval adds up to its own length to the deploy phase.
  [[http_service.checks]]
    grace_period = "5s"
    interval = "5s"
    timeout = "2s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
